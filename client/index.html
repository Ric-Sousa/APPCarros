<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logicar — lembretes de IUC, inspeção e manutenção do seu carro</title>
    <meta name="description" content="Nunca mais pague multa por IUC ou inspeção em atraso. Lembretes por email e no telemóvel, histórico de manutenção, despesas e combustível num só lugar." />
    <meta name="theme-color" content="#2b6ae9" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Logicar" />
    <meta property="og:title" content="Logicar — gestão de veículos" />
    <meta property="og:description" content="Lembretes de IUC, inspeção, seguro e manutenção. Grátis para 1 veículo." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      // Apply saved theme preference as early as possible to avoid flash
      (function() {
        try {
          var theme = (JSON.parse(localStorage.getItem('user-preferences') || '{}') || {}).theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (theme === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            // 'auto' or null -> respect prefers-color-scheme but don't override later
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
